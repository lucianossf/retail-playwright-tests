name: Retail Playwright Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run test:chromium
        env:
          RETAIL_BASE_URL: https://demo.opensourcepos.org
          RETAIL_USERNAME: admin
          RETAIL_PASSWORD: pointofsale
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: retail-playwright-report
          path: playwright-report/
          retention-days: 7
